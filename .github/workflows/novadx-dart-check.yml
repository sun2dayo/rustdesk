# NovaDX: verificação rápida (~5 min) do código Dart antes de uma compilação completa.
# Só falha com erros do analisador (avisos e infos do upstream são ignorados).
name: NovaDX Dart check

on:
  workflow_dispatch:
  push:
    branches: [novadx]
    paths:
      - "flutter/lib/**"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  analyze:
    needs: generate-bridge
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: "3.24.5"

      - name: flutter analyze (erros apenas)
        working-directory: flutter
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/
